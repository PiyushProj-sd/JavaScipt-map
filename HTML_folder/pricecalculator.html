<!DOCTYPE html>
<html>
  <head>
    <link href="cssfiles/PriceList.css" rel="stylesheet">
    <title>Amazon Price List</title>
  </head>

  <body>
    <div class="box">
      <h1>
        Order Summary
      </h1>

      <div class="para">
        <div>
          <p>
            Items (3):
          </p>
        </div>
        
        <div>
          <p>
            $47.93
          </p>
        </div>
      </div>

      <div class="para">
        <div>
          <p>
            Shipping & handling:
          </p>
        </div>

        <div>
          <p>
            $4.99
          </p>
        </div>
      </div>

      <div class="para">
        <div>
          <p>
            Total before tax:
          </p>
        </div>
        
        <div>
          <p>
            $52.92
          </p>
        </div>
      </div>

      <div class="para">
        <div>
          <p>
            Estimated tax (10%):
          </p>
        </div>

        <div>
          <p>
            $5.29
          </p>
        </div>
      </div>

      <div>
        <p class="breaker">
          -------------------------------------------------------------------
        </p>
      </div>

      <div class="para">
        <div>
          <p class="total">
            Order total:
          </p>
        </div>

        <div>
          <p class="total">
            $58.21
          </p>
        </div>
      </div>
    </div>
  </body>
  <script src="JS-files/start.js"></script>
</html>
