<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="CSSStyle/Nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <header>
      <div class="nav-bar">
        <div class="nav-logo border">
          <img src="amazon_logo.png" class="logo">
        </div>

        <div class="nav-add border">
          <div class="location">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div>
            <span>
              Deliver to
            </span>
            <p class="add-loc">
              India
            </p>
          </div>
        </div>
        
        <div class="nav-search">
          <select class="search-select">
            <option>
              All
            </option>
          </select>

          <input placeholder="Search Amazon" class="search">

          <div class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <div class="language border">
          <div>
            <img src="Language/US.webp" class="lan">
          </div>
          <select class="lan-name">
            <option>
              EN
            </option>
          </select>
        </div>

        <div class="signin border">
          <div class="line1">
            <p class="line1-para">
              Hello, sign in
            </p>
          </div>
          <div class="line2">
            <select class="line2-select">
              <option>
                Account & Lists
              </option>
            </select>
          </div>
        </div>

        <div class="signin border">
          <div class="line1-para1">
            <p>
              Returns
            </p>
          </div>
          <div class="line2">
            <p class="line2-select">
              & Order
            </p>
          </div>
        </div>

        <div class="cart">
          <i class="fa-solid fa-cart-shopping"></i>
          
        </div>
      </div>
    </header>
  </body>
</html>
